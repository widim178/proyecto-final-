<div class="card h-100 bg-dark text-white border border-secondary shadow-lg rounded-4 overflow-hidden">

  <!-- IMAGEN DE LA GUITARRA -->

  <div class="position-relative">
    <img
      [src]="guitarra.imagen"
      class="card-img-top w-100 object-fit-contain bg-black p-3"
      alt="{{ guitarra.nombre }}"
      style="height: 260px;"
    >

<!-- AÑO -->
<span class="badge bg-danger position-absolute top-0 end-0 m-3 fs-6">
  {{ guitarra.anio }}
</span>

  </div>

  <!-- INFORMACIÓN -->

  <div class="card-body d-flex flex-column p-4">

<h5 class="card-title fw-bold text-uppercase text-warning mb-3">
  {{ guitarra.nombre }}
</h5>

<p class="card-text text-secondary mb-3">
  Una guitarra única para músicos que buscan calidad, personalidad y un sonido inconfundible.
</p>

<div class="mt-auto">

  <!-- PRECIO -->
  <h4 class="fw-bold text-white mb-3">
    ${{ guitarra.precio }}
  </h4>

  <!-- BOTÓN -->
  <button
    type="button"
    class="btn btn-danger w-100 fw-bold py-2"
    (click)="onAgregar()"
  >
    <span class="me-2">🛒</span>
    AGREGAR AL CARRITO
  </button>

</div>

  </div>
</div>
