<div class="container-fluid bg-black text-white min-vh-100 py-5">
  <div class="container">

    <div class="text-center mb-5">
      <span class="badge bg-danger px-3 py-2 mb-3">NUESTRA COLECCIÓN</span>
      <h1 class="display-3 fw-bold text-uppercase">
        NUESTRAS <span class="text-warning">GUITARRAS</span>
      </h1>
      <p class="text-secondary fs-5 mt-3">
        Encontrá el instrumento ideal para crear tu propio sonido.
      </p>
    </div>

    <div class="row g-4">

      @for (producto of guitarras; track producto.id) {
        <div class="col-12 col-md-6 col-lg-4">

          <div class="card h-100 bg-dark text-white border border-secondary rounded-4 overflow-hidden shadow-lg">

            <div class="position-relative">
              <img
                [src]="producto.imagen"
                [alt]="producto.nombre"
                class="card-img-top w-100 object-fit-contain bg-black p-3"
                style="height: 260px;"
              >

              <span class="badge bg-danger position-absolute top-0 end-0 m-3 fs-6">
                {{ producto.anio }}
              </span>
            </div>

            <div class="card-body d-flex flex-column p-4">

              <h5 class="card-title fw-bold text-warning text-uppercase mb-3">
                {{ producto.nombre }}
              </h5>

              <p class="text-secondary">
                Una guitarra para músicos que buscan calidad, personalidad y un sonido único.
              </p>

              <div class="mt-auto">
                <h4 class="fw-bold mb-3">
                  ${{ producto.precio }}
                </h4>

                <button
                  type="button"
                  class="btn btn-danger w-100 fw-bold py-2"
                  (click)="onAgregar(producto)"
                >
                  🛒 AGREGAR AL CARRITO
                </button>
              </div>

            </div>
          </div>

        </div>
      }

    </div>
  </div>
</div>
